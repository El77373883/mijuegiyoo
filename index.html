<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>INFERNO ROYALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0908;
    --void-2:#151110;
    --panel:#1C1512;
    --panel-2:#241B17;
    --ember:#FF5A1F;
    --molten:#FFB020;
    --blood:#7A1421;
    --bone:#EDE1D3;
    --bone-dim:#9C8E7F;
    --line:#3A2E27;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--void);overflow:hidden;
    font-family:'Rajdhani',sans-serif;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app{
    position:relative;width:100%;height:100vh;height:100dvh;
    overflow:hidden;color:var(--bone);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .bg-layer{position:absolute;inset:0;z-index:0;}
  .bg-layer::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 15%, rgba(255,90,31,0.16), transparent 55%),
               linear-gradient(180deg, rgba(11,9,8,0.35) 0%, rgba(11,9,8,0.55) 55%, rgba(11,9,8,0.96) 100%);
  }
  .bg-embers{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .ember-particle{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;
    background:var(--molten);box-shadow:0 0 6px 2px rgba(255,176,32,0.7);
    animation:rise linear infinite;opacity:0.8;}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:0.9;}
    100%{transform:translateY(-100vh) translateX(var(--drift,20px));opacity:0;}
  }

  /* ---------- TOP BAR — BANNER COMPACTO ARRIBA A LA DERECHA ---------- */
  .topbar-wrap{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 8px);
    right:10px;
    z-index:5;
    max-width:78%;
  }
  .topbar{
    display:flex;align-items:center;
    gap:8px;
    padding:5px 8px 5px 5px;
    border-radius:14px;
    background-size:cover;
    background-position:center 40%;
    transition:background 0.4s ease;
    border:1.5px solid var(--molten);
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,0,0,0.35);
    position:relative;
  }
  .topbar::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(90deg, rgba(11,9,8,0.7) 0%, rgba(11,9,8,0.25) 50%, rgba(11,9,8,0.6) 100%);
    pointer-events:none;
  }
  .topbar > *{position:relative;z-index:1;}

  /* Avatar compacto */
  .profile-btn{display:flex;align-items:center;gap:7px;background:none;border:none;padding:0;}
  .avatar-frame{position:relative;width:44px;height:44px;flex-shrink:0;}
  .avatar-frame .frame-bg{
    position:absolute;inset:0;border-radius:8px;
    background:linear-gradient(135deg, #FFB020 0%, #FF5A1F 45%, #7A1421 100%);
    padding:2px;
    box-shadow:0 0 8px rgba(255,176,32,0.6), inset 0 0 5px rgba(0,0,0,0.5);
  }
  .avatar-ring{
    position:absolute;inset:2px;border-radius:6px;overflow:hidden;
    background:var(--panel-2);display:flex;align-items:center;justify-content:center;
  }
  .avatar-ring svg{width:100%;height:100%;}

  .level-badge{
    position:absolute;bottom:-3px;left:-3px;
    background:linear-gradient(180deg,#FFB020,#FF5A1F);
    color:#2a1a00;font-family:'Anton',sans-serif;font-size:9px;
    padding:1px 5px;border-radius:4px;
    border:1.2px solid #0B0908;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
    letter-spacing:0.3px;
  }

  .profile-label{display:flex;flex-direction:column;line-height:1.05;gap:1px;max-width:110px;}
  .profile-name{
    font-family:'Anton',sans-serif;font-size:13px;letter-spacing:0.5px;
    color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(255,176,32,0.35);
  }
  .profile-sub{
    font-size:8.5px;color:var(--molten);font-weight:700;
    letter-spacing:1px;text-transform:uppercase;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Emblema de rango compacto a la derecha */
  .rank-emblem{
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 0 6px rgba(255,90,31,0.6));
  }
  .rank-emblem svg{width:100%;height:100%;}

  /* Monedas — pastilla chica debajo del banner, alineada a la derecha */
  .coin-pill{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 66px);
    right:10px;z-index:6;
    display:flex;align-items:center;gap:5px;
    background:rgba(28,21,18,0.9);border:1.5px solid var(--molten);
    border-radius:40px;padding:4px 11px;backdrop-filter:blur(6px);
    box-shadow:0 3px 10px rgba(0,0,0,0.5);
  }
  .coin-icon{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 30% 30%, var(--molten), var(--ember) 70%);
    box-shadow:0 0 5px rgba(255,176,32,0.6);flex-shrink:0;}
  .coin-num{font-weight:700;font-size:12px;color:var(--bone);}

  /* ---------- LOBBY ---------- */
  .lobby-screen{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}

  .player-stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;padding-top:60px;}
  .player-glow{position:absolute;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,90,31,0.28) 0%, transparent 70%);filter:blur(4px);animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:0.7;}50%{transform:scale(1.12);opacity:1;}}
  .player-figure{position:relative;z-index:2;width:130px;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.6));}

  .title-mark{position:absolute;top:16%;left:0;right:0;text-align:center;pointer-events:none;}
  .title-mark h1{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:3px;margin:0;
    background:linear-gradient(180deg, var(--bone) 0%, var(--molten) 60%, var(--ember) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 12px rgba(255,90,31,0.35);}
  .title-mark p{margin:2px 0 0;font-size:10px;letter-spacing:3px;color:var(--bone-dim);font-weight:700;}

  /* ---------- BOTTOM ---------- */
  .bottom-bar{position:relative;z-index:4;width:100%;padding:0 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:10px;}
  .side-buttons{width:100%;display:flex;justify-content:space-between;gap:10px;}
  .icon-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(180deg, rgba(36,27,23,0.9), rgba(20,15,13,0.9));
    border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;transition:transform .12s ease, border-color .12s ease;}
  .icon-btn:active{transform:scale(0.94);border-color:var(--ember);}
  .icon-btn .glyph{width:22px;height:22px;}
  .icon-btn .lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--bone-dim);}

  .play-btn{width:100%;position:relative;border:none;padding:0;background:none;cursor:pointer;}
  .play-btn .surface{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 0;border-radius:12px;
    background:linear-gradient(180deg, #FF7A38 0%, var(--ember) 45%, var(--blood) 100%);
    border:1.5px solid rgba(255,178,80,0.6);
    box-shadow:0 6px 0 #4a0d13, 0 8px 18px rgba(122,20,33,0.45);
    transition:transform .08s ease, box-shadow .08s ease;}
  .play-btn:active .surface{transform:translateY(5px);box-shadow:0 1px 0 #4a0d13, 0 3px 8px rgba(122,20,33,0.45);}
  .play-btn .surface span{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2px;color:#FFF3E4;
    text-shadow:0 2px 3px rgba(0,0,0,0.35);}
  .players-count{font-size:10px;color:var(--bone-dim);font-weight:700;letter-spacing:1px;}

  /* ---------- PANELS ---------- */
  .panel{position:absolute;inset:0;z-index:20;background:linear-gradient(180deg, var(--void-2), var(--void) 60%);
    transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .panel.open{transform:translateY(0);}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;
    border-bottom:1.5px solid var(--line);flex-shrink:0;}
  .panel-title{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:2px;color:var(--bone);}
  .panel-title .accent{color:var(--molten);}
  .close-btn{width:32px;height:32px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--bone-dim);flex-shrink:0;}
  .close-btn:active{background:var(--panel-2);}

  .panel-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;}
  .section-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--bone-dim);margin:12px 0 8px;}
  .section-label:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .grid.bgs{grid-template-columns:repeat(2,1fr);}

  .item-card{position:relative;border-radius:12px;border:2px solid var(--line);background:var(--panel);
    padding:8px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden;transition:border-color .12s;}
  .item-card.equipped{border-color:var(--molten);box-shadow:0 0 0 1px var(--molten), 0 0 12px rgba(255,176,32,0.35);}
  .item-card.locked{opacity:0.55;}
  .item-card:active{transform:scale(0.97);}
  .item-card .icon-wrap{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line);}
  .item-card .icon-wrap svg{width:100%;height:100%;}
  .bg-card .icon-wrap{width:100%;height:56px;border-radius:6px;}
  .item-name{font-size:10px;font-weight:700;text-align:center;letter-spacing:0.3px;line-height:1.2;color:var(--bone);}
  .price-tag{display:flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--molten);}
  .price-tag .mini-coin{width:8px;height:8px;border-radius:50%;background:var(--molten);flex-shrink:0;}
  .equipped-flag{position:absolute;top:4px;right:4px;background:var(--molten);color:#2a1a00;font-size:7.5px;font-weight:700;
    padding:1.5px 4px;border-radius:5px;letter-spacing:0.4px;}
  .season-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg, var(--blood), var(--ember));
    padding:5px 10px;border-radius:20px;margin-bottom:4px;}
  .season-badge span{font-family:'Anton',sans-serif;font-size:10px;letter-spacing:1.2px;color:#FFF3E4;}

  .save-bar{padding:10px 14px 14px;flex-shrink:0;border-top:1.5px solid var(--line);}
  .save-btn{width:100%;padding:12px 0;border:none;border-radius:10px;font-family:'Anton',sans-serif;font-size:14px;
    letter-spacing:2px;color:#FFF3E4;background:linear-gradient(180deg,#FF7A38,var(--ember));
    box-shadow:0 4px 0 #7a2b0d;}
  .save-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7a2b0d;}

  .toast{position:absolute;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);z-index:50;
    background:var(--panel);border:1.5px solid var(--molten);padding:8px 16px;border-radius:30px;
    font-size:12px;font-weight:700;color:var(--bone);opacity:0;transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.4);max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty-state{text-align:center;padding:30px 20px;color:var(--bone-dim);font-size:12px;font-weight:600;}

  /* =====================================================
     IPHONE / ANDROID EN HORIZONTAL (landscape)
     Aquí reducimos todo para que no se vea gigante al girar
     ===================================================== */
  @media (orientation: landscape){
    .topbar-wrap{top:calc(env(safe-area-inset-top) + 6px);right:8px;max-width:55%;}
    .topbar{padding:4px 7px 4px 4px;border-radius:12px;}
    .avatar-frame{width:36px;height:36px;}
    .avatar-frame .frame-bg{padding:1.5px;border-radius:7px;}
    .avatar-ring{inset:1.5px;border-radius:6px;}
    .level-badge{font-size:8px;padding:1px 4px;bottom:-3px;left:-3px;}
    .profile-name{font-size:11px;max-width:85px;}
    .profile-sub{font-size:7.5px;letter-spacing:0.8px;}
    .rank-emblem{width:30px;height:30px;}

    .coin-pill{top:calc(env(safe-area-inset-top) + 52px);right:8px;padding:3px 9px;}
    .coin-icon{width:11px;height:11px;}
    .coin-num{font-size:11px;}

    .player-stage{padding-top:40px;}
    .player-figure{width:100px;}
    .player-glow{width:150px;height:150px;}
    .title-mark{top:10%;}
    .title-mark h1{font-size:20px;letter-spacing:2px;}
    .title-mark p{font-size:9px;letter-spacing:2px;}

    .bottom-bar{padding:0 12px calc(8px + env(safe-area-inset-bottom));gap:7px;}
    .side-buttons{gap:8px;}
    .icon-btn{padding:6px 4px;border-radius:10px;}
    .icon-btn .glyph{width:18px;height:18px;}
    .icon-btn .lbl{font-size:9px;}
    .play-btn .surface{padding:11px 0;border-radius:10px;}
    .play-btn .surface span{font-size:14px;letter-spacing:1.5px;}
    .players-count{font-size:9px;}

    .panel-header{padding:10px 12px 8px;}
    .panel-title{font-size:16px;}
    .grid{grid-template-columns:repeat(4,1fr);gap:7px;}
    .grid.bgs{grid-template-columns:repeat(3,1fr);}
    .item-card .icon-wrap{width:36px;height:36px;}
    .bg-card .icon-wrap{height:46px;}
    .item-name{font-size:9px;}
    .panel-body{padding:12px;}
  }

  /* iPhone muy chico en portrait */
  @media (orientation: portrait) and (max-height:700px){
    .player-figure{width:110px;}
    .player-glow{width:170px;height:170px;}
    .title-mark h1{font-size:22px;}
    .title-mark{top:12%;}
    .play-btn .surface{padding:12px 0;}
  }
</style>
</head>
<body>
<div id="app">

  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-embers" id="embers"></div>

  <div class="lobby-screen">

    <!-- BANNER DEL PERFIL — compacto arriba a la derecha -->
    <div class="topbar-wrap">
      <div class="topbar" id="topbar">
        <button class="profile-btn" id="openProfile">
          <span class="avatar-frame">
            <span class="frame-bg"></span>
            <span class="avatar-ring" id="topAvatar"></span>
            <span class="level-badge">42</span>
          </span>
          <span class="profile-label">
            <span class="profile-name">ADRIAN_MX</span>
            <span class="profile-sub">Llama de Bronce</span>
          </span>
        </button>

        <div class="rank-emblem">
          <svg viewBox="0 0 64 64">
            <path d="M32 6l6 8 10-2-2 10 8 6-8 6 2 10-10-2-6 8-6-8-10 2 2-10-8-6 8-6-2-10 10 2z"
                  fill="#7A1421" stroke="#FFB020" stroke-width="2" stroke-linejoin="round"/>
            <path d="M32 18l4 6 7-1-1 7 5 4-5 4 1 7-7-1-4 6-4-6-7 1 1-7-5-4 5-4-1-7 7 1z"
                  fill="#FF5A1F"/>
            <circle cx="32" cy="32" r="5" fill="#FFB020"/>
          </svg>
        </div>
      </div>

      <div class="coin-pill">
        <span class="coin-icon"></span>
        <span class="coin-num" id="coinDisplay">0</span>
      </div>
    </div>

    <div class="player-stage">
      <div class="title-mark">
        <h1>INFERNO ROYALE</h1>
        <p>TEMPORADA 1 · FUEGO</p>
      </div>
      <div class="player-glow"></div>
      <div class="player-figure" id="playerFigure"></div>
    </div>

    <div class="bottom-bar">
      <div class="side-buttons">
        <button class="icon-btn" id="openInventory">
          <span class="glyph">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="2" stroke="#EDE1D3" stroke-width="1.6"/><path d="M3 8l2-4h14l2 4" stroke="#EDE1D3" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12a3 3 0 0 0 6 0" stroke="#FFB020" stroke-width="1.6"/></svg>
          </span>
          <span class="lbl">INVENTARIO</span>
        </button>

        <button class="play-btn" id="playBtn" style="flex:1.4;">
          <span class="surface"><span>INICIAR PARTIDA</span></span>
        </button>

        <button class="icon-btn" id="openShop">
          <span class="glyph">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 9l1.5-5h13L20 9" stroke="#EDE1D3" stroke-width="1.6" stroke-linejoin="round"/><rect x="4" y="9" width="16" height="11" rx="1.5" stroke="#EDE1D3" stroke-width="1.6"/><path d="M9 13a3 3 0 0 0 6 0" stroke="#FFB020" stroke-width="1.6"/></svg>
          </span>
          <span class="lbl">TIENDA</span>
        </button>
      </div>
      <div class="players-count">47 / 50 JUGADORES EN COLA</div>
    </div>
  </div>

  <div class="panel" id="profilePanel">
    <div class="panel-header">
      <span class="panel-title">MI <span class="accent">PERFIL</span></span>
      <button class="close-btn" data-close="profilePanel">✕</button>
    </div>
    <div class="panel-body">
      <div class="section-label">AVATAR</div>
      <div class="grid" id="profileIconGrid"></div>
      <div class="section-label">BANNER DEL PERFIL</div>
      <div class="grid bgs" id="profileBgGrid"></div>
    </div>
    <div class="save-bar">
      <button class="save-btn" id="saveProfileBtn">GUARDAR CAMBIOS</button>
    </div>
  </div>

  <div class="panel" id="shopPanel">
    <div class="panel-header">
      <span class="panel-title">TIENDA <span class="accent">DE FUEGO</span></span>
      <button class="close-btn" data-close="shopPanel">✕</button>
    </div>
    <div class="panel-body">
      <span class="season-badge"><span>TEMPORADA 1 · COLECCIÓN FUEGO</span></span>
      <div class="section-label">AVATARES</div>
      <div class="grid" id="shopIconGrid"></div>
      <div class="section-label">BANNERS DE FUEGO</div>
      <div class="grid bgs" id="shopBgGrid"></div>
    </div>
  </div>

  <div class="panel" id="inventoryPanel">
    <div class="panel-header">
      <span class="panel-title">MI <span class="accent">INVENTARIO</span></span>
      <button class="close-btn" data-close="inventoryPanel">✕</button>
    </div>
    <div class="panel-body">
      <div class="section-label">AVATARES OBTENIDOS</div>
      <div class="grid" id="invIconGrid"></div>
      <div class="section-label">BANNERS OBTENIDOS</div>
      <div class="grid bgs" id="invBgGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ AVATARES ============ */
const ICONS = [
  { id:'ic_default', name:'Llama Base', price:0,
    svg:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#241B17"/><path d="M32 12c6 8-4 10-4 18a8 8 0 0 0 16 0c0-4-2-6-2-6 4 2 6 8 6 12 0 8.8-7.2 16-16 16s-16-7.2-16-16C16 26 24 20 32 12z" fill="#FF5A1F"/><path d="M32 24c2 4-2 6-2 10a4 4 0 0 0 8 0c0-2-1-3-1-3 2 1 3 4 3 6 0 4.4-3.6 8-8 8s-8-3.6-8-8c0-6 4-9 8-13z" fill="#FFB020"/></svg>` },
  { id:'ic_skull_gold', name:'Calavera Dorada', price:300,
    svg:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#1a1408"/><ellipse cx="32" cy="30" rx="14" ry="13" fill="#FFB020"/><rect x="24" y="38" width="16" height="8" rx="2" fill="#FFB020"/><circle cx="26" cy="28" r="4" fill="#1a1408"/><circle cx="38" cy="28" r="4" fill="#1a1408"/><path d="M30 34l2 4 2-4" stroke="#1a1408" stroke-width="2" fill="none"/><path d="M18 18c4-8 24-8 28 0" stroke="#FF5A1F" stroke-width="3" fill="none" stroke-linecap="round"/></svg>` },
  { id:'ic_tiger', name:'Tigre Salvaje', price:400,

/* ============ BANNERS DE FUEGO + FONDOS MODERNOS ============ */

    css:'linear-gradient(160deg, #0a0a1f 0%, #1e3a8a 40%, #60a5fa 75%, #dbeafe 100%)' },

    css:'linear-gradient(140deg, #0e7490 0%, #22d3ee 45%, #f0fdff 100%)' },

    css:'radial-gradient(circle at 50% 50%, #10b981 0%, #064e3b 40%, #02120a 80%)' },
  { id:'bg_sakura', name:'Sakura Nocturna', price:580,
    css:'linear-gradient(180deg, #1a0218 0%, #831843 45%, #fbcfe8 100%)' },

/* ============ STATE ============ */
let state = {
  coins: 5000,
  equippedIcon: 'ic_default',
  equippedBg: 'bg_default',
  ownedIcons: ['ic_default'],
  ownedBgs: ['bg_default'],
};
let draftIcon = state.equippedIcon;
let draftBg = state.equippedBg;

const STORAGE_KEY = 'inferno-royale-profile';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state = Object.assign(state, saved);
    }
  }catch(e){ /* no saved profile yet */ }
  draftIcon = state.equippedIcon;
  draftBg = state.equippedBg;
  renderAll();
}

async function persistState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){ console.error('No se pudo guardar el perfil', e); }
}

/* ============ HELPERS ============ */
function findIcon(id){ return ICONS.find(i=>i.id===id) || ICONS[0]; }
function findBg(id){ return BACKGROUNDS.find(b=>b.id===id) || BACKGROUNDS[0]; }

function applyEquipped(){
  document.getElementById('topbar').style.background = findBg(state.equippedBg).css;
  document.getElementById('topAvatar').innerHTML = findIcon(state.equippedIcon).svg;
  document.getElementById('coinDisplay').textContent = state.coins.toLocaleString('es-MX');
}

function previewBg(bgId){
  document.getElementById('topbar').style.background = findBg(bgId).css;
}
function revertPreview(){
  document.getElementById('topbar').style.background = findBg(state.equippedBg).css;
}

function buildPlayerFigure(){
  const emberColor = '#FF5A1F';
  document.getElementById('playerFigure').innerHTML = `
    <svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="60" cy="210" rx="34" ry="8" fill="#000" opacity="0.35"/>
      <rect x="44" y="120" width="32" height="55" rx="10" fill="#2A2422" stroke="#3A2E27" stroke-width="2"/>
      <rect x="30" y="128" width="14" height="42" rx="7" fill="#241B17"/>
      <rect x="76" y="128" width="14" height="42" rx="7" fill="#241B17"/>
      <rect x="38" y="168" width="16" height="40" rx="6" fill="#1C1512"/>
      <rect x="66" y="168" width="16" height="40" rx="6" fill="#1C1512"/>
      <circle cx="60" cy="95" r="26" fill="#EDE1D3"/>
      <path d="M36 90c0-16 10-28 24-28s24 12 24 28c-6-4-14-6-24-6s-18 2-24 6z" fill="#241B17"/>
      <rect x="42" y="90" width="36" height="10" rx="5" fill="${emberColor}" opacity="0.85"/>
      <path d="M50 118c4-10 16-10 20 0" stroke="#3A2E27" stroke-width="3" fill="none"/>
    </svg>`;
}

function itemCard({item, type, owned, equipped, mode}){
  const isBg = type==='bg';
  const card = document.createElement('div');
  card.className = 'item-card ' + (isBg?'bg-card':'') + (equipped?' equipped':'') + (!owned && mode==='profile' ? ' locked':'');
  const iconInner = isBg
    ? `<div class="icon-wrap" style="background:${item.css}"></div>`
    : `<div class="icon-wrap">${item.svg}</div>`;
  card.innerHTML = `
    ${equipped ? '<span class="equipped-flag">EQUIPADO</span>' : ''}
    ${iconInner}
    <span class="item-name">${item.name}</span>
    ${mode==='shop' && !owned ? `<span class="price-tag"><span class="mini-coin"></span>${item.price}</span>` : ''}
    ${mode==='shop' && owned ? `<span class="price-tag" style="color:#9C8E7F;">EN POSESIÓN</span>` : ''}
  `;
  return card;
}

function renderProfilePanel(){
  const iconGrid = document.getElementById('profileIconGrid');
  const bgGrid = document.getElementById('profileBgGrid');
  iconGrid.innerHTML = ''; bgGrid.innerHTML = '';

  ICONS.forEach(item=>{
    const owned = state.ownedIcons.includes(item.id);
    const card = itemCard({item, type:'icon', owned, equipped: draftIcon===item.id, mode:'profile'});
    if(owned){
      card.addEventListener('click', ()=>{
        draftIcon = item.id;
        document.getElementById('topAvatar').innerHTML = findIcon(draftIcon).svg;
        renderProfilePanel();
      });
    }
    iconGrid.appendChild(card);
  });

  BACKGROUNDS.forEach(item=>{
    const owned = state.ownedBgs.includes(item.id);
    const card = itemCard({item, type:'bg', owned, equipped: draftBg===item.id, mode:'profile'});
    if(owned){
      card.addEventListener('click', ()=>{
        draftBg = item.id;
        previewBg(draftBg);
        renderProfilePanel();
      });
    }
    bgGrid.appendChild(card);
  });
}

function renderShopPanel(){
  const iconGrid = document.getElementById('shopIconGrid');
  const bgGrid = document.getElementById('shopBgGrid');
  iconGrid.innerHTML = ''; bgGrid.innerHTML = '';

  ICONS.forEach(item=>{
    const owned = state.ownedIcons.includes(item.id);
    const card = itemCard({item, type:'icon', owned, equipped:false, mode:'shop'});
    if(!owned) card.addEventListener('click', ()=> buyItem(item, 'icon'));
    iconGrid.appendChild(card);
  });

  BACKGROUNDS.forEach(item=>{
    const owned = state.ownedBgs.includes(item.id);
    const card = itemCard({item, type:'bg', owned, equipped:false, mode:'shop'});
    if(!owned) card.addEventListener('click', ()=> buyItem(item, 'bg'));
    bgGrid.appendChild(card);
  });
}

function buyItem(item, type){
  if(state.coins < item.price){
    showToast('No tienes suficientes monedas');
    return;
  }
  state.coins -= item.price;
  if(type==='icon') state.ownedIcons.push(item.id);
  else state.ownedBgs.push(item.id);
  persistState();
  applyEquipped();
  renderShopPanel();
  renderProfilePanel();
  renderInventoryPanel();
  showToast(`${item.name} desbloqueado`);
}

function renderInventoryPanel(){
  const iconGrid = document.getElementById('invIconGrid');
  const bgGrid = document.getElementById('invBgGrid');
  iconGrid.innerHTML = ''; bgGrid.innerHTML = '';

  const ownedIcons = ICONS.filter(i=>state.ownedIcons.includes(i.id));
  const ownedBgs = BACKGROUNDS.filter(b=>state.ownedBgs.includes(b.id));

  ownedIcons.forEach(item=>{
    iconGrid.appendChild(itemCard({item, type:'icon', owned:true, equipped: state.equippedIcon===item.id, mode:'inventory'}));
  });
  ownedBgs.forEach(item=>{
    bgGrid.appendChild(itemCard({item, type:'bg', owned:true, equipped: state.equippedBg===item.id, mode:'inventory'}));
  });
}

function renderAll(){
  buildPlayerFigure();
  applyEquipped();
  renderProfilePanel();
  renderShopPanel();
  renderInventoryPanel();
}

/* ============ NAV ============ */
function openPanel(id){
  if(id==='profilePanel'){ draftIcon = state.equippedIcon; draftBg = state.equippedBg; renderProfilePanel(); }
  if(id==='shopPanel'){ renderShopPanel(); }
  if(id==='inventoryPanel'){ renderInventoryPanel(); }
  document.getElementById(id).classList.add('open');
}
function closePanel(id){ document.getElementById(id).classList.remove('open'); }

document.getElementById('openProfile').addEventListener('click', ()=> openPanel('profilePanel'));
document.getElementById('openShop').addEventListener('click', ()=> openPanel('shopPanel'));
document.getElementById('openInventory').addEventListener('click', ()=> openPanel('inventoryPanel'));

document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.close === 'profilePanel'){
      draftIcon = state.equippedIcon;
      draftBg = state.equippedBg;
      revertPreview();
      document.getElementById('topAvatar').innerHTML = findIcon(state.equippedIcon).svg;
    }
    closePanel(btn.dataset.close);
  });
});

document.getElementById('saveProfileBtn').addEventListener('click', async ()=>{
  state.equippedIcon = draftIcon;
  state.equippedBg = draftBg;
  await persistState();
  applyEquipped();
  closePanel('profilePanel');
  showToast('Perfil guardado');
});

document.getElementById('playBtn').addEventListener('click', ()=>{
  showToast('Buscando partida...');
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1800);
}

function spawnEmbers(){
  const container = document.getElementById('embers');
  for(let i=0;i<22;i++){
    const p = document.createElement('div');
    p.className = 'ember-particle';
    const left = Math.random()*100;
    const duration = 5 + Math.random()*6;
    const delay = Math.random()*8;
    const drift = (Math.random()*40-20)+'px';
    const size = 2 + Math.random()*2;
    p.style.left = left+'%';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = delay+'s';
    p.style.setProperty('--drift', drift);
    container.appendChild(p);
  }
}

spawnEmbers();
loadState();
</script>
